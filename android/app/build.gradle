plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silkcrowd.renderer'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.silkcrowd.renderer"
        minSdk 26           // Vulkan 1.1 + dynamic rendering fallback path
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-26"
                cppFlags "-std=c++17 -O2"
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'   // phones/tablets and the CI emulator
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab false
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
        }
    }
}

dependencies {
}
